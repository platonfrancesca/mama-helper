# Test configuration: replaces src/main/resources/application.properties during tests.
# Tests always use a fresh in-memory database and never touch the real data file.
spring.application.name=mama-helper

spring.datasource.url=jdbc:h2:mem:mamahelper-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
